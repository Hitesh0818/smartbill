version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartbill
      POSTGRES_PASSWORD: smartbill
      POSTGRES_DB: smartbill
    ports:
      - "5432:5432"
    volumes:
      - smartbill_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartbill-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  smartbill_postgres: